# /etc/dhcp/dhcpd.conf
# Sample ISC DHCP Server Configuration

default-lease-time 86400;
max-lease-time 604800;
authoritative;
ddns-update-style none;
log-facility local7;

# Corporate LAN Subnet
# IoT & Infrastructure Subnet
# Static IP Reservations (Hosts)


subnet 192.168.1.0 netmask 255.255.255.0 {
  range 192.168.1.100 192.168.1.200;
  option routers 192.168.1.1;
  option subnet-mask 255.255.255.0;
  option broadcast-address 192.168.1.255;
  option domain-name-servers 1.1.1.1, 8.8.8.8;
  option domain-name "corp.internal";
  default-lease-time 86400;
  max-lease-time 172800;
}

subnet 10.0.0.0 netmask 255.255.255.0 {
  range 10.0.0.50 10.0.0.150;
  option routers 10.0.0.1;
  option subnet-mask 255.255.255.0;
  option broadcast-address 10.0.0.255;
  option domain-name-servers 8.8.8.8, 8.8.4.4;
  option domain-name "iot.internal";
  default-lease-time 43200;
  max-lease-time 86400;
}

host dev-workstation {
  hardware ethernet 00:1a:2b:3c:4d:5e;
  fixed-address 192.168.1.50;
}

host office-printer {
  hardware ethernet 08:00:27:fa:61:9a;
  fixed-address 192.168.1.60;
}

host core-nas {
  hardware ethernet 52:54:00:12:34:56;
  fixed-address 10.0.0.10;
}
